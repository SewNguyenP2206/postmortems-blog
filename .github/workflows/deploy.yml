name: 🔄 Generate Postmortem Manifest & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'postmortems/**'
      - '.nojekyll'
      - 'index.html'
      - 'post.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/**'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write        # Needed to push manifest.json back to repo
  pages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Scan postmortems/ folder and generate manifest.json
  # ──────────────────────────────────────────────────────────────
  build-manifest:
    name: 📋 Generate manifest.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure .nojekyll exists
        run: touch .nojekyll

      - name: Generate postmortems/manifest.json and manifest.js
        run: |
          python3 - <<'PYEOF'
          import os, json, re
          from datetime import datetime, timezone

          print("🔍 Scanning postmortems/ directory...")

          def parse_frontmatter(text):
              m = re.match(r'^---\s*\n([\s\S]+?)\n---\s*\n?([\s\S]*)$', text)
              if not m:
                  return {}, text
              raw_meta, content = m.group(1), m.group(2)
              meta = {}
              for line in raw_meta.splitlines():
                  if ':' not in line:
                      continue
                  key, val = line.split(':', 1)
                  key = key.strip()
                  val = val.strip()
                  if val.startswith('[') and val.endswith(']'):
                      items = [re.sub(r'^["\']|["\']$', '', s.strip()) for s in val[1:-1].split(',') if s.strip()]
                      meta[key] = items
                  else:
                      meta[key] = re.sub(r'^["\']|["\']$', '', val)
              return meta, content

          post_dir = "postmortems"
          files = sorted(
              [f for f in os.listdir(post_dir) if f.endswith(".md") and not f.startswith("_")],
              reverse=True
          )

          print(f"📝 Found {len(files)} postmortem file(s)")
          posts = []
          for f in files:
              print(f"  - {f}")
              path = os.path.join(post_dir, f)
              with open(path, "r", encoding="utf-8") as fh:
                  raw = fh.read()
              meta, content = parse_frontmatter(raw)
              slug = f.rsplit(".", 1)[0]
              item = {
                  "filename": f,
                  "slug": slug,
                  "content": content
              }
              item.update(meta)
              posts.append(item)

          posts.sort(key=lambda p: p.get("date", ""), reverse=True)

          manifest_data = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "count": len(posts),
              "files": files,
              "posts": posts
          }

          with open(os.path.join(post_dir, "manifest.json"), "w", encoding="utf-8") as fh:
              json.dump(manifest_data, fh, indent=2, ensure_ascii=False)

          with open(os.path.join(post_dir, "manifest.js"), "w", encoding="utf-8") as fh:
              fh.write("// Auto-generated by CI - provides synchronous and offline data\n")
              fh.write("(typeof window !== 'undefined' ? window : global).POSTMORTEM_MANIFEST = ")
              json.dump(manifest_data, fh, indent=2, ensure_ascii=False)
              fh.write(";\n")

          print("✅ manifest.json and manifest.js generated successfully")
          PYEOF

      - name: Commit manifest files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .nojekyll postmortems/manifest.json postmortems/manifest.js

          if git diff --staged --quiet; then
            echo "✅ manifest files unchanged – no commit needed"
          else
            git commit -m "chore: update postmortems manifest [skip ci]"
            git push
            echo "✅ manifest files committed and pushed"
          fi

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-manifest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (with updated manifest)
        uses: actions/checkout@v4
        with:
          ref: main    # Pull latest commit (includes manifest.json)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Upload entire repo root as the site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print site URL
        run: |
          echo "🎉 Site deployed to: ${{ steps.deployment.outputs.page_url }}"
